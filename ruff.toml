# Ruff — fast Python linter and formatter
# Replaces: flake8, pycodestyle, pydocstyle, pyupgrade, isort (via [lint.isort])

# Notebooks contain teaching code — skip linting them; only lint .py files.
extend-exclude = ["**/*.ipynb"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import order)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernise syntax)
    "B",    # flake8-bugbear (likely bugs / bad practices)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no bare print in library code)
    "RUF",  # ruff-specific rules
]

ignore = [
    "S101",   # allow assert (used in tests)
    "T201",   # allow print() in scripts / demos
    "E501",   # line length managed by formatter
    "S603",   # subprocess without shell=True is fine
    "S607",   # partial executable paths acceptable in scripts
]

[lint.per-file-ignores]
"tests/**"                  = ["S101", "PLR2004"]
"study-guide/render_pdf.py" = ["S603", "S607"]

[lint.isort]
known-first-party = ["devops_utils"]
force-sort-within-sections = true
split-on-trailing-comma = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88

[lint.mccabe]
max-complexity = 10
