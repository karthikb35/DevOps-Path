name: CI — Lint, Format & Protection Tests

# Runs on every PR and every push to main.
# Must pass before any PR can be merged (configured as a required status check
# in GitHub → Settings → Branches → Branch protection rules).
#
# Jobs:
#   lint     — ruff check + ruff format --check (replaces flake8 + isort)
#   test     — pytest protection tests (notebook structure, workflow YAML,
#              HTML books, CODEOWNERS presence)
#
# Why separate jobs (not steps)?
#   Parallel execution: lint and test run simultaneously, halving wall time.
#   Independent failure: a lint error doesn't hide test failures (and vice versa).
#   Required checks: GitHub lets you require "lint" and "test" independently, so
#   a typo fix PR doesn't need to wait for the full test suite.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs on new push to the same branch (saves minutes).
# Never cancel on main — always let main runs finish for accurate status.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. LINT — ruff check + ruff format --check
  #    Replaces: flake8, pycodestyle, pyflakes, isort, pyupgrade, bandit
  #    All rules configured in ruff.toml at repo root.
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv + ruff
        run: pip install uv && uv tool install ruff

      - name: ruff check — linting (E, W, F, I, N, UP, B, S…)
        run: uvx ruff check . --output-format=github
        # --output-format=github annotates PR diff with inline error comments

      - name: ruff format --check — formatting (no auto-fix on CI)
        run: uvx ruff format --check .
        # Fails if any file would be reformatted; run 'ruff format .' locally to fix

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. IMPORT-SORT check — isort via ruff (rule set "I")
  #    Separated into a named check so branch protection can require it
  #    independently of other lint rules.
  # ─────────────────────────────────────────────────────────────────────────────
  isort:
    name: Import Order (isort via ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv + ruff
        run: pip install uv && uv tool install ruff

      - name: ruff check — import order (I rules only)
        run: uvx ruff check . --select I --output-format=github

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. PROTECTION TESTS — pytest structural / repo-health checks
  #    Tests: notebook JSON validity, no committed outputs, workflow YAML,
  #    HTML book structure, CODEOWNERS presence, module completeness.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Protection Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv and sync dev dependencies
        run: |
          pip install uv
          uv pip install --system pytest pytest-cov pyyaml
        # installs test deps into the system Python; no lockfile needed

      - name: pytest — structural protection tests
        run: pytest tests/ -v --tb=short

      - name: Upload coverage (optional, non-blocking)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. YAML LINT — validate all workflow YAML files are well-formed
  #    Catches syntax errors in .github/workflows/*.yml before they're
  #    pushed and silently break CI.
  # ─────────────────────────────────────────────────────────────────────────────
  yaml-lint:
    name: YAML Lint (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint .github/workflows/
        run: |
          yamllint -d '{
            extends: default,
            rules: {
              line-length: {max: 140},
              truthy: {allowed-values: ["true", "false", "on"]},
              comments: {min-spaces-from-content: 1}
            }
          }' .github/workflows/

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. SECURITY SCAN — detect secrets accidentally committed
  #    Catches API keys, tokens, passwords in code, YAML, and notebooks.
  # ─────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only scan on PRs — trufflehog compares base..head which is always defined
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (trufflesecurity/trufflehog)
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
