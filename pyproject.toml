[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-study-repo"
version = "0.1.0"
requires-python = ">=3.11"

# Dev dependencies — installed with: uv sync --dev
[project.optional-dependencies]
dev = [
    "ruff>=0.5.7",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pyyaml>=6.0",
    "yamllint>=1.35",
    "pre-commit>=3.7",
    "playwright>=1.44",
]

[tool.uv]
# uv will always create a virtual environment in .venv/
# Run:   uv sync --dev          to install everything
# Run:   uv run pytest tests/   to run tests inside the venv
# Run:   uv run ruff check .    to lint inside the venv
dev-dependencies = [
    "ruff>=0.5.7",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pyyaml>=6.0",
    "yamllint>=1.35",
    "pre-commit>=3.7",
    "playwright>=1.44",
]

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short -q"
python_files  = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.isort]
# Kept for editors that use isort directly; ruff handles CI enforcement.
profile          = "black"
line_length      = 88
known_first_party = ["devops_utils"]
force_sort_within_sections = true

[tool.coverage.run]
source    = ["."]
omit      = ["tests/*", "study-guide/*", ".github/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
